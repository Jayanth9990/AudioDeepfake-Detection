datamodule:
  _target_: safeear.datas.asvspoof21.DataModule
  batch_size: 2
  num_workers: 4
  pin_memory: true

  DataClass_dict:
    _target_: safeear.datas.asvspoof21.DataClass

    train_path: ["datas/ASVSpoof2019/train.tsv", "datas/ASVSpoof2019/ASVspoof2019.LA.cm.train.trn.txt", "/home/sameera/unofficail_audio_deepfake/D3/features_hubert/train"]

    val_path: ["datas/ASVSpoof2019/dev.tsv", "datas/ASVSpoof2019/ASVspoof2019.LA.cm.dev.trl.txt", "/home/sameera/unofficail_audio_deepfake/D3/features_hubert/dev"]

    test_path: ["datas/ASVSpoof2019/eval.tsv", "datas/ASVSpoof2019/ASVspoof2019.LA.cm.eval.trl.txt", "/home/sameera/unofficail_audio_deepfake/D3/features_hubert/eval" ]

    max_len: 64600


# ------------------------------
# Tokenizer (unchanged)
# ------------------------------
decouple_model:
  _target_: safeear.models.decouple.SpeechTokenizer
  n_filters: 64
  strides: [8, 5, 4, 2]
  dimension: 1024
  semantic_dimension: 768
  bidirectional: true
  dilation_base: 2
  residual_kernel_size: 3
  n_residual_layers: 1
  lstm_layers: 2
  activation: ELU
  codebook_size: 1024
  n_q: 8
  sample_rate: 16000

speechtokenizer_path: /home/sameera/unofficail_audio_deepfake/E3/model_zoos/SpeechTokenizer.pt


# ------------------------------
# Detection model (SafeEar + TFC)
# ------------------------------
detect_model:
  _target_: safeear.models.safeear.SafeEar1s

  front:
    _target_: safeear.models.safeear.SE_Rawformer_front

  embedding_dim: 1024
  dropout_rate: 0.1
  attention_dropout: 0.1
  stochastic_depth: 0.1
  num_layers: 2
  num_heads: 8
  num_classes: 2
  positional_embedding: 'sine'
  mlp_ratio: 1.0


# ------------------------------
# Training system
# ------------------------------
system:
  _target_: safeear.trainer.safeear_trainer.SafeEarTrainer
  lr_raw_former: 3.0e-4
  save_score_path: ${exp.dir}/${exp.name}


# ------------------------------
# Experiment config
# ------------------------------
exp:
  dir: Exps/
  name: ASVspoof21


# ------------------------------
# Early stopping
# ------------------------------
early_stopping:
  _target_: pytorch_lightning.callbacks.EarlyStopping
  monitor: val_eer
  mode: min
  patience: 20
  verbose: true


# ------------------------------
# Checkpoint
# ------------------------------
checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: ${exp.dir}/${exp.name}/checkpoints
  monitor: val_eer
  mode: min
  verbose: true
  save_top_k: 1
  save_last: true
  filename: '{epoch}-{val_eer:.4f}'


# ------------------------------
# Logger
# ------------------------------
logger:
  _target_: pytorch_lightning.loggers.WandbLogger
  name: ${exp.name}
  save_dir: ${exp.dir}/${exp.name}/logs
  offline: true
  project: SafeEar


# ------------------------------
# Trainer
# ------------------------------
trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: gpu
  devices: [0]
  max_epochs: 40
  sync_batchnorm: true
  default_root_dir: ${exp.dir}/${exp.name}/
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  fast_dev_run: false

